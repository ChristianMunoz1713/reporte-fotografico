<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reporte Fotográfico</title>
  <meta name="theme-color" content="#17345c">
  <meta name="description" content="Reportes fotográficos ANTES / DESPUÉS de unidades a partir de los defectos de Tcar.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <button id="btnAtras" class="icono" aria-label="Regresar" hidden>&#8592;</button>
    <h1 id="titulo">Reporte Fotográfico</h1>
    <button id="btnInstalar" class="btn-instalar" hidden>Instalar</button>
    <button id="btnAjustes" class="icono" aria-label="Ajustes">&#9881;</button>
  </header>

  <main id="vista"></main>

  <!-- Entradas ocultas para cámara / galería -->
  <input type="file" id="camara" accept="image/*" capture="environment" hidden>
  <input type="file" id="galeria" accept="image/*" hidden>
  <input type="file" id="archivoTcar" accept=".xlsx,.xls,.csv,.txt" multiple hidden>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
